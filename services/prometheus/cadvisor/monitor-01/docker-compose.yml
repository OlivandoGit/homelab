networks:
  monitoring:
    external: true

services:
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest 
    container_name: cadvisor-monitor-01
    
    devices:
      - /dev/kmsg
    
    privileged: true
    
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
  
    networks:
      - monitoring
      
    restart: unless-stopped