networks:
  monitoring:
    external: true

  monitoring-frontend:
    external: true

volumes:
  prometheus-data:

services:
  prometheus:
    image: prom/prometheus:latest

    container_name: prometheus

    command: "--config.file=/etc/prometheus/prometheus.yaml"

    volumes:
      - /mnt/docker-volumes/prometheus/config:/etc/prometheus:ro
      - prometheus-data:/prometheus
    
    networks:
      - monitoring
      - monitoring-frontend

    expose:
      - 9090

    ports:
      - 9090:9090
    
    restart: unless-stopped
