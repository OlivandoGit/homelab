networks:
  bind9-monitoring:
    external: true

services:
  bind9-resolver:
    image: internetsystemsconsortium/bind9:9.20
    container_name: bind9-resolver

    environment:
      - BIND9_USER=root
      - TZ=Europe/London

    volumes:
      - /etc/bind/resolver/named.conf:/etc/bind/named.conf

    ports:
      - "53:53/tcp"
      - "53:53/udp"

    expose:
      - 80

    networks:
      - bind9-monitoring      

    restart: unless-stopped
